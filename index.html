<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pilaster 3D + IFC — innfesting stålsøyle (NS-EN 1992-4)</title>
  <style>
    :root { --bg:#f4f4f1; --panel:#fcfcfb; --line:#d9d9d2; --ink:#0b0b0b; --ink2:#52514e; --acc:#2a78d6;
      --ink3:#8a897f; --surf2:#eeeeea;
      --good:#0ca30c; --bad:#d03b3b; --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
      --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; }
    *{box-sizing:border-box} html,body{margin:0;height:100%}
    body{font-family:var(--sans);color:var(--ink);background:var(--bg);display:flex;height:100vh;overflow:hidden}
    #panel{width:340px;min-width:340px;height:100%;overflow-y:auto;background:var(--panel);border-right:1px solid var(--line);padding:14px 16px}
    #panel h1{font-size:15px;margin:0 0 2px} #panel .sub{font-size:11.5px;color:var(--ink2);margin-bottom:12px}
    .sec{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--acc);margin:14px 0 6px}
    .row{display:grid;grid-template-columns:1fr 92px;gap:6px;align-items:center;margin:3px 0;position:relative}
    .row label{font-size:12.5px;color:var(--ink2)}
    .row input[type=number],.row select{font-family:var(--mono);font-size:12.5px;padding:3px 5px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--ink);width:100%}
    .row.check{grid-template-columns:1fr auto}
    .row .u{font-size:10.5px;color:var(--ink3)}
    .row label{display:flex;align-items:center;gap:5px}

    /* lastene staar oeverst og framheves - de nullstilles ved refresh */
    .sec.emph{color:var(--ink);background:var(--surf2);border-left:3px solid var(--acc);
      border-radius:0 5px 5px 0;padding:5px 8px;margin:2px 0 6px}
    .row.emph input{border-color:var(--acc);font-weight:700}

    /* ---- «?»-hjelpeboks ---- */
    .q{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;
      border-radius:50%;border:1px solid var(--line);background:var(--surf2);color:var(--ink3);
      font-size:9.5px;font-weight:700;cursor:help;flex:0 0 auto;user-select:none}
    .q:hover,.q:focus{background:var(--acc);color:#fff;border-color:transparent;outline:none}
    .qp{display:none;position:absolute;left:0;right:0;top:calc(100% + 3px);z-index:20;
      background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;
      box-shadow:0 4px 14px rgba(0,0,0,.13);font-size:11.5px;font-weight:400;line-height:1.5;
      color:var(--ink2);text-align:left;cursor:default}
    .qp b{color:var(--ink);font-family:var(--mono)}
    .qp em{display:block;margin-top:5px;font-style:normal;color:var(--acc);font-size:10.5px}
    .q:hover .qp,.q:focus .qp{display:block}

    /* ---- hint: hvilke inndata som hjelper naar en kontroll ryker ---- */
    .row.hint input,.row.hint select{border-color:#e08a2e;background:#fff8ef}
    .row.hint label{color:#a3610f}
    .arrow{color:#e08a2e;font-weight:700;font-size:12px;cursor:help}

    /* ---- hovedomrade med faner ---- */
    #main{flex:1;display:flex;flex-direction:column;min-width:0}
    #tabbar{display:flex;gap:2px;padding:8px 12px 0;border-bottom:1px solid var(--line);background:var(--panel);flex:0 0 auto}
    #tabbar button{font-family:var(--sans);font-size:13px;font-weight:600;border:1px solid var(--line);border-bottom:none;
      background:var(--surf2);color:var(--ink2);padding:7px 16px;border-radius:8px 8px 0 0;cursor:pointer;margin-bottom:-1px}
    #tabbar button[aria-selected=true]{background:var(--bg);color:var(--ink);border-bottom:1px solid var(--bg)}
    .view{flex:1;min-height:0;position:relative;display:none}
    .view.on{display:block}

    /* ---- 3D ---- */
    #stage{position:absolute;inset:0} canvas{width:100%;height:100%;display:block}
    #bar{position:absolute;top:12px;left:12px;display:flex;gap:8px;flex-wrap:wrap}
    #bar button,.pbtn{font-family:var(--sans);font-size:12.5px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.06)}
    #bar button.primary,.pbtn.primary{background:var(--acc);color:#fff;border-color:transparent}
    #legend{position:absolute;bottom:12px;left:12px;background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:11.5px}
    #legend .li{display:flex;align-items:center;gap:6px;margin:2px 0}
    #legend .sw{width:12px;height:12px;border-radius:3px}
    #toggles{position:absolute;top:12px;right:12px;background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px}
    #toggles label{display:flex;gap:6px;align-items:center;margin:2px 0;cursor:pointer}
    /* ---- utnyttelsesgrader, alltid synlige i 3D ---- */
    #util{position:absolute;bottom:38px;right:12px;width:232px;background:rgba(255,255,255,.94);
      border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:11.5px;
      box-shadow:0 1px 4px rgba(0,0,0,.08)}
    #util .uhead{font-weight:700;font-size:12px;padding:1px 2px 5px;border-bottom:1px solid var(--line);
      margin-bottom:4px;display:flex;justify-content:space-between;align-items:baseline}
    #util .uhead.g{color:var(--good)} #util .uhead.r{color:var(--bad)}
    #util .uign{font-weight:400;font-size:10.5px;color:var(--ink3)}
    #util .ur{display:flex;align-items:center;gap:6px;padding:1.5px 3px;border-radius:4px;cursor:pointer}
    #util .ur input{margin:0;flex:0 0 auto;cursor:pointer;width:11px;height:11px}
    #util .un{flex:1 1 auto}
    #util .un{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #util .ur:hover{background:var(--surf2)}
    #util .uv{font-family:var(--mono);font-weight:700;white-space:nowrap}
    #util .ur.g .uv{color:var(--good)} #util .ur.o .uv{color:#d98014}
    #util .ur.r .uv{color:var(--bad)} #util .ur.r{background:#fdeaea}
    #util .ur.o{background:#fdf3e6}
    #util .ur.ign{opacity:.5} #util .ur.ign .uv{color:var(--ink3);font-weight:400;font-style:italic}

    #status{position:absolute;bottom:12px;right:12px;font-size:11.5px;color:var(--ink2);background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:6px;padding:4px 8px}

    /* ---- 2D ---- */
    #view2d{overflow-y:auto;padding:14px 18px}
    #mechbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
    #mechbar button{font-family:var(--sans);font-size:12.5px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--ink2);padding:6px 12px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:6px}
    #mechbar button[aria-pressed=true]{border-color:currentColor;background:var(--panel);color:var(--ink)}
    #mechbar .dot{width:9px;height:9px;border-radius:50%}
    #mechtext{font-size:12.5px;color:var(--ink2);line-height:1.55;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:6px;padding:9px 12px;margin-bottom:12px}
    #mechtext i{font-family:var(--mono);font-style:normal;background:var(--surf2);padding:0 3px;border-radius:3px}
    .figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
    .fig{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px}

    /* ---- rapport ---- */
    #viewdoc{overflow-y:auto;padding:0}
    .doc{max-width:1000px;margin:0 auto;padding:18px 24px 60px;background:var(--panel);min-height:100%}
    .doc h1{font-size:18px;margin:0 0 4px} .doc h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--acc);margin:22px 0 8px;border-bottom:1px solid var(--line);padding-bottom:4px}
    .doc h3{font-size:13px;margin:16px 0 6px}
    .docmeta{font-size:11.5px;color:var(--ink2);display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
    .docactions{display:flex;gap:8px;margin:10px 0 4px}
    table.t{width:100%;border-collapse:collapse;font-size:11.5px}
    table.t td,table.t th{border-bottom:1px solid var(--line);padding:3px 6px;vertical-align:top;text-align:left}
    table.t th{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink3);font-weight:700}
    table.t tr.grp td{background:var(--surf2);font-weight:700;font-size:11px;color:var(--ink);padding:5px 6px}
    .dsym{font-family:var(--mono);white-space:nowrap;font-weight:600}
    .dfml,.dsub{font-family:var(--mono);color:var(--ink2);font-size:11px}
    .dres{font-family:var(--mono);text-align:right;white-space:nowrap;font-weight:600}
    .dref{color:var(--ink3);font-size:10.5px;white-space:nowrap}
    .badge{font-size:10.5px;font-weight:700;border-radius:999px;padding:1px 8px;white-space:nowrap}
    .badge.ok{background:#e6f6e6;color:#0a7c0a} .badge.no{background:#fbe7e7;color:#b32d2d}
    .badge.ign{background:var(--surf2);color:var(--ink3)}
    tr.ignrow .dfml,tr.ignrow .dsym span{text-decoration:line-through;opacity:.6}
    label.ig{display:flex;align-items:center;gap:6px;cursor:pointer;font-family:var(--mono)}
    label.ig input{cursor:pointer;flex:0 0 auto}
    .warn{background:#fdf3e6;border:1px solid #e8c99a;border-left:3px solid #d98014;
      border-radius:6px;padding:8px 11px;font-size:11.5px;color:#7a4a09;margin:10px 0 4px;line-height:1.55}
    .notes{width:100%;font-family:var(--sans);font-size:12px;line-height:1.6;color:var(--ink);
      border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:#fff;resize:vertical}
    .notes:focus{outline:none;border-color:var(--acc)}
    .notesprint{display:none;font-size:12px;line-height:1.6;white-space:pre-wrap;color:var(--ink2)}
    .ok{color:var(--good)} .bad{color:var(--bad)}
    .doc code{font-family:var(--mono);font-size:11px;background:var(--surf2);padding:0 3px;border-radius:3px}
    .doc ul{font-size:11.5px;line-height:1.6;color:var(--ink2);padding-left:18px}
    .res{font-family:var(--mono);font-size:12px;border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
    .res .r{display:flex;justify-content:space-between;margin:2px 0} .res .r b{font-weight:700}

    /* ---- utskrift / PDF ---- */
    @page { size: A4 portrait; margin: 14mm 12mm; }
    @media print {
      html,body{height:auto;overflow:visible;display:block;background:#fff}
      #panel,#tabbar,#view3d,#view2d,.docactions,#status,#util{display:none !important}
      .notes{display:none !important} .notesprint{display:block !important}
      label.ig input{display:none} .warn{break-inside:avoid;page-break-inside:avoid}
      #main{display:block;height:auto} .view{display:none !important;position:static;height:auto}
      #viewdoc{display:block !important;overflow:visible;height:auto}
      .doc{max-width:none;margin:0;padding:0;background:#fff}
      .doc h2{break-after:avoid;page-break-after:avoid}
      table.t{break-inside:auto} table.t tr{break-inside:avoid;page-break-inside:avoid}
      table.t tr.grp{break-after:avoid;page-break-after:avoid}
      .figs{break-inside:avoid;page-break-inside:avoid;grid-template-columns:1fr 1fr}
      .fig{border:1px solid #ccc}
      .badge.ok{background:none;color:#0a7c0a} .badge.no{background:none;color:#b32d2d}
    }
  </style>
</head>
<body>
  <div id="panel">
    <h1>Pilaster 3D + IFC</h1>
    <div class="sub">Innfesting stålsøyle · NS-EN 1992-4 · web-ifc + three.js</div>
    <div id="inputs"></div>
    <div class="res" id="results"></div>
  </div>

  <div id="main">
    <div id="tabbar" role="tablist">
      <button role="tab" data-tab="3d" aria-selected="true">3D</button>
      <button role="tab" data-tab="2d" aria-selected="false">2D snitt</button>
      <button role="tab" data-tab="doc" aria-selected="false">Beregningsrapport</button>
    </div>

    <div class="view on" id="view3d">
      <div id="stage">
        <canvas id="c"></canvas>
        <div id="bar">
          <button class="primary" id="btnIfc">Eksporter IFC</button>
          <button id="btnGlb">Eksporter GLB</button>
          <button id="btnFit">Sentrer</button>
        </div>
        <div id="toggles"></div>
        <div id="legend"></div>
        <div id="util"></div>
        <div id="status">klar</div>
      </div>
    </div>

    <div class="view" id="view2d">
      <div id="mechbar"></div>
      <div id="mechtext"></div>
      <div class="figs" id="figs2d"></div>
    </div>

    <div class="view" id="viewdoc">
      <div class="doc" id="doc"></div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
